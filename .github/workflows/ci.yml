name: Murafiq Release Gate & Security Integration CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    name: Mandatory Build & Security Integration Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK (v21) for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Validation (Lint)
        run: npm run lint

      - name: Build Production Application
        run: npm run build

      - name: Run Logic & Security Unit Tests
        run: npm test

      - name: Run Mandatory Firebase Emulator Security Integration Tests
        run: npm run test:rules

      - name: Run Offline-First Emulator Integration Tests
        run: npm run test:offline
